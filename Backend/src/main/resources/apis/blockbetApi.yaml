openapi: 3.0.1
info:
  title: blockbet general API
  description: This is a sample API used to illustrate the tooling around an API-first approach.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /blockbet/infos:
    get:
      summary: get account infos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfosGetResponse'
    put:
      summary: update account infos (only provided fields are updated)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfosPutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfosGetResponse'

  /blockbet/wallet:
    post:
      summary: create a blockchain wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletPostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPostResponse'

  /blockbet/wallets:
    get:
      summary: get wallets infos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsGetResponse'

  /blockbet/transfer-tokens:
    put:
      summary: transfer tokens to another address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTokensPutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTokensPutResponse'

  /blockbet/receipts:
    get:
      summary: get the transaction receipts sent from or to the caller's wallets, newest first
      parameters:
        - in: query
          name: offset
          required: true
          schema:
            type: integer
        - in: query
          name: limit
          description: page size, 1 to 100
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptsGetResponse'


  /blockbet/bets:
    get:
      summary: list the bets, newest first (bet details from the database, rules and money from the smart contract)
      parameters:
        - in: query
          name: offset
          required: true
          schema:
            type: integer
        - in: query
          name: limit
          description: page size, 1 to 50
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetsGetResponse'

  /blockbet/bets/{betId}:
    get:
      summary: get one bet
      parameters:
        - in: path
          name: betId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetResponse'

components:
  schemas:
    BetOption:
      type: string
      description: >
        Option letters in the order of the bet's options (A is the first). A bet has 2 to 5 options,
        so a bet with 3 options only accepts A, B and C.
      enum:
        - A
        - B
        - C
        - D
        - E

    BetContractType:
      type: string
      description: >
        Which smart contract a bet runs on.
        MULTIPLE_OPTION_SIMPLE_POOL: 2 to 5 options, the whole pool is split equally between the bettors of the winning option.
        More types are added here together with their contract (see BetContractService).
      enum:
        - MULTIPLE_OPTION_SIMPLE_POOL

    BetStatus:
      type: string
      description: >
        OPEN: bets accepted. CLOSED: betting time is over, waiting for the bookie's result.
        RESOLVED: winner picked and paid out. REFUNDED: the internal team gave everybody their stake back.
        CAUTION: the bookie has not resolved for too long, the internal team has to handle it.
      enum:
        - OPEN
        - CLOSED
        - RESOLVED
        - REFUNDED
        - CAUTION

    TxHashResponse:
      type: object
      required:
        - txHash
      properties:
        txHash:
          type: string

    BetsGetResponse:
      type: object
      required:
        - offset
        - limit
        - total
        - result
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        result:
          type: array
          items:
            $ref: '#/components/schemas/BetResponse'

    BetResponse:
      type: object
      properties:
        betId:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        contractType:
          $ref: '#/components/schemas/BetContractType'
        bookieAddress:
          type: string
        options:
          description: the options of the bet, in order (the first one is A)
          type: array
          items:
            $ref: '#/components/schemas/BetOptionInfo'
        stake:
          description: wei each bettor sends
          type: integer
        pool:
          description: total wei staked on this bet (stake x number of bettors)
          type: integer
        closeTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BetStatus'
        winner:
          $ref: '#/components/schemas/BetOption'
        createdAt:
          type: string
          format: date-time

    InfosGetResponse:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        phone:
          type: string
        address:
          type: string
        nationality:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'

    InfosPutRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 64
        avatarUrl:
          type: string
          maxLength: 512
        phone:
          type: string
          maxLength: 16
        address:
          type: string
          maxLength: 256
        nationality:
          type: string
          minLength: 2
          maxLength: 2
        dateOfBirth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'

    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
        - OTHER

    ReceiptsGetResponse:
      type: object
      required:
        - offset
        - limit
        - total
        - result
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        result:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptsGetResponseEntry'
    ReceiptsGetResponseEntry:
      type: object
      properties:
        hash:
          type: string
        fromAddress:
          type: string
        toAddress:
          type: string
        blockHash:
          type: string
        blockNumber:
          type: integer
        gasUsed:
          type: integer
        effectiveGasPrice:
          type: integer
        transactionType:
          type: string
          enum:
            - FUNDING
            - TOKEN_TRANSFER
            - BET_INTERNAL_PAYOUT
            - BET_PAYOUT
            - BET_STAKE
        amount:
          description: amount in wei, when known (null for older receipts)
          type: integer
          nullable: true
        success:
          description: null while the transaction is pending, true once confirmed, false if it failed
          type: boolean
          nullable: true

    TransferTokensPutRequest:
      type: object
      required:
        - fromAddress
        - toAddress
        - amount
        - idempotencyKey
      properties:
        fromAddress:
          type: string
        toAddress:
          type: string
        amount:
          description: token amount in wei
          type: integer
        idempotencyKey:
          description: >
            client-generated id (letters, digits, '-' or '_', at most 64 chars) for this transfer.
            Re-sending the same key for the same wallet returns the original transaction hash instead of
            sending the tokens again, so a request can be retried safely after a timeout.
          type: string

    TransferTokensPutResponse:
      type: object
      required:
        - txHash
      properties:
        txHash:
          type: string

    WalletsGetResponse:
      type: object
      properties:
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
    Wallet:
      type: object
      required:
        - address
        - publicKey
        - privateKey
        - balance
      properties:
        address:
          type: string
        publicKey:
          type: string
        privateKey:
          type: string
        balance:
          description: account balance in wei
          type: number

    WalletPostRequest:
      type: object
      properties:
        password:
          type: string
    WalletPostResponse:
      type: object
      required:
        - address
        - publicKey
        - privateKey
      properties:
        address:
          type: string
        publicKey:
          type: string
        privateKey:
          type: string

    BetOptionInfo:
      type: object
      properties:
        option:
          $ref: '#/components/schemas/BetOption'
        name:
          type: string
        bettors:
          description: number of wallets that bet on this option
          type: integer
