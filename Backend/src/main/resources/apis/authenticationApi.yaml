openapi: 3.0.1
info:
  title: blockbet authentication API
  description: This is a sample API used to illustrate the tooling around an API-first approach.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /auth/login:
    post:
      summary: log in and retrieve an access token and a refresh token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginPostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
  /auth/refresh:
    post:
      summary: exchange a refresh token for a new access token and a new refresh token (rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshPostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: refresh token is unknown, expired, revoked or already used
  /auth/logout:
    post:
      summary: revoke the refresh token (and its whole rotation chain). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutPostRequest'
      responses:
        '204':
          description: refresh token revoked (or it was already unknown)
  /auth/sign-up:
    post:
      summary: sign up an account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignUpRequest'
      responses:
        '200':
          description: OK
components:
  schemas:
    AuthLoginPostRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: short-lived JWT, sent as "Authorization Bearer" on API calls
        refreshToken:
          type: string
          description: opaque long-lived token, only used against /auth/refresh and /auth/logout
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: access token lifetime in seconds
    AuthRefreshPostRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthLogoutPostRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthSignUpRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string