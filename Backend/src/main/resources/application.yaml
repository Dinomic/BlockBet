spring:
  application:
    name: blockbet
  datasource:
    username: postgres
    url: jdbc:postgresql://localhost:5432/blockbetdb?currentSchema=dev
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: dev
  flyway:
    locations: classpath:db/migration
    schemas: dev
    url: jdbc:postgresql://localhost:5432/blockbetdb
    user: postgres
    password: postgres
    baseline-on-migrate: true
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never   # the QRTZ_ tables are created by Flyway (V0.0.3)
    overwrite-existing-jobs: true   # so a changed interval below replaces the one saved in the database
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true   # several backend instances share the jobs; each run happens on one
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.threadPool.threadCount: 4
blockbet:
  receipt-tracker:
    interval-ms: 5000    # how often pending transfers are checked on chain
  bet-caution:
    interval-ms: 60000   # how often overdue bets are checked for CAUTION
security:
  jwt:
    expirationTime: 15 #mins, access token
    refreshExpirationDays: 7 #days, refresh token
    issuer: "blockbet"
    secretKey: "superSecretKeyNoOneCanGuess"
blockchain:
  network:
    url: "http://localhost:8301"
    chainId: 12345
  mainAccount:
    address: "0x4f1809cf76a8946d615cb546271cae3ea36328ed"
    privateKey: "0xbe4b83a3bff4fd9ec8b060e68fab18a2c0f78ac3943865931dcb73e6303dc48c"
logging:
  level:
    org.springframework.security: DEBUG